<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - CommunityGate</title>
    <link rel="stylesheet" href="signup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="threejs-background"></div>
    <div class="signup-container">
        <div class="logo-container">
            <h1>CommunityGate</h1>
            <p>Your Community, Connected</p>
        </div>
        <h2>Create Your Account</h2>
        <div class="role-selector">
            <div class="role-option active" data-role="resident">
                <i class="fas fa-home"></i>
                <span>Resident</span>
            </div>
            <div class="role-option" data-role="admin">
                <i class="fas fa-user-shield"></i>
                <span>Admin</span>
            </div>
            <div class="role-option" data-role="security">
                <i class="fas fa-shield-alt"></i>
                <span>Security</span>
            </div>
        </div>
        <form action="signup_process.php" method="POST">
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" name="username" placeholder="Full Name" required>
            </div>
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" name="email" placeholder="Email" required>
            </div>
            <div class="input-group">
                <i class="fas fa-mobile-alt"></i>
                <input type="tel" name="phone" placeholder="Phone Number" required>
            </div>
            <div class="input-group">
                <i class="fas fa-building"></i>
                <input type="text" name="apartment" placeholder="Apartment/Flat Number" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" name="confirm_password" placeholder="Confirm Password" required>
            </div>
            <input type="hidden" name="role" value="resident" id="role-input">
            <div class="terms-checkbox">
                <label><input type="checkbox" required> I agree to the <a href="#">Terms & Conditions</a></label>
            </div>
            <button type="submit">Create Account <i class="fas fa-user-plus"></i></button>
        </form>
        <p class="login-link">Already have an account? <a href="login.html">Login</a></p>
        <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="signup.js"></script>
</body>
</html>
